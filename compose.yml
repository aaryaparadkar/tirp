services:
  postgres:
    image: postgres:16
    container_name: oshc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oshc_catalogue
    ports:
      - "5432:5432"
    volumes:
      - oshc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d oshc_catalogue"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oshc-postgres-data:

