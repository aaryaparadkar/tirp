services:
  - type: web
    name: oshc-whatsapp-catalogue
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oshc-catalogue-db
          property: connectionString
      - key: KAPSO_API_KEY
        sync: false
      - key: KAPSO_WEBHOOK_SECRET
        sync: false
      - key: KAPSO_PHONE_NUMBER_ID
        sync: false
      - key: OSHC_FLOW_ID
        sync: false
      - key: MISTRAL_API_KEYS
        sync: false
      - key: MISTRAL_MODEL
        value: "mistral-small-latest"
      - key: MISTRAL_BASE_URL
        value: "https://api.mistral.ai/v1"
      - key: MISTRAL_TIMEOUT_MS
        value: "15000"
      - key: QUIZ_REMINDER_TEMPLATE
        sync: false
      - key: QUIZ_REMINDER_TEMPLATE_LANGUAGE
        value: en
      - key: QUIZ_FLOW_ID
        sync: false
      - key: QUIZ_TRIGGER_TOKEN
        sync: false
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: oshc-catalogue-db
    plan: free
